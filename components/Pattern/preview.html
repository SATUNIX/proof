<!-- @dsCard group="Symbols" height=780 subtitle="13 fills: pattern kinds" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112,100..800&display=swap">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font-family:var(--font-sans)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .col{display:grid;gap:24px}</style>
<div id="root"></div>
<script>
var P = window.Proof, h = React.createElement, Row = function(){ return h.apply(null, ['div',{className:'row'}].concat([].slice.call(arguments))); };
function Demo(){
  var kinds=['barcode','halftone','dots','ticks','stripes','hatch','checker','grid','crosses','ruler','steps','waves','chevrons'];
  return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:24}}, kinds.map(function(k,i){
    return h('div',{key:k,style:{display:'grid',gap:8}}, h(P.Pattern,{kind:k,height:56,tone:i%4===2?'violet':undefined,seed:'proof '+k}), h('span',{style:{fontFamily:'var(--font-mono)',fontSize:11,textTransform:'uppercase'}},k));
  }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
